      sub: { en: 'circular water concept for a residential building', de: 'zirkuläres wasserkonzept für ein wohngebäude' },
      place: 'berlin, germany', who: 'julius morgenstern',
      note: { en: '1. prize and schoeck hochschulpreis', de: '1. preis und schoeck hochschulpreis' },
      text: {
        en: [
          'As part of the student competition Urban Roof Space, initiated by Schöck and AIT Dialog, the potentials of rooftop spaces in urban environments were explored. This resulted in the development of a circular water concept for a residential building, making natural water treatment tangible and transforming the roof into a productive, social space. Otherwise hidden processes, such as wastewater treatment, are made visible through the constructed wetlands, pipes and water basins. The aim is to raise awareness of sustainable ways of dealing with water while creating a community space.',
          'An important source of inspiration was Block 6 by Dr. Ekhart Hahn, implemented as part of IBA 84/87. The project connected a constructed wetland with the adjacent residential block and made water tangible for residents through a rainwater pond. The exclusively horizontal arrangement of the basins lacked sufficient oxygen enrichment between the individual treatment stages. Arranging the basins in a cascading sequence, following the topography of the existing roof, effectively overcomes this issue.'
        ],
        de: [
          'Im Rahmen des Studierendenwettbewerbs Urban Roof Space, ausgelobt von Schöck und AIT Dialog, wurden die Potenziale von Dachflächen in urbanen Räumen untersucht. Daraus entstand ein zirkuläres Wasserkonzept für ein Wohngebäude, das die natürliche Wasserreinigung erfahrbar macht und das Dach in einen produktiven, sozialen Raum verwandelt. Sonst verborgene Prozesse wie die Abwasserbehandlung werden durch Pflanzenkläranlagen, Rohre und Wasserbecken sichtbar. Ziel ist es, das Bewusstsein für einen nachhaltigen Umgang mit Wasser zu schärfen und zugleich einen Gemeinschaftsraum zu schaffen.',
          'Eine wichtige Inspirationsquelle war Block 6 von Dr. Ekhart Hahn, umgesetzt im Rahmen der IBA 84/87. Das Projekt verband eine Pflanzenkläranlage mit dem angrenzenden Wohnblock und machte Wasser für die Bewohner durch einen Regenwasserteich erfahrbar. Die ausschließlich horizontale Anordnung der Becken führte zu einer unzureichenden Sauerstoffanreicherung zwischen den einzelnen Reinigungsstufen. Werden die Becken stattdessen kaskadenartig entlang der Topografie des bestehenden Daches angeordnet, lässt sich dieses Problem wirksam lösen.'
        ]

    { id: 'prototype', t: 'prototype', y: 2026, kind: 'photo', ar: '4 / 5', cover: 'img/pt-cover.webp', cw: 1904, ch: 2380, cn: 5, cm: 7, cml: -1,
      sub: { en: 'prototype for vertical constructed wetlands', de: 'prototyp für vertikale pflanzenkläranlagen' },
      who: 'timo marpert',
      text: {
        en: ['The prototype for vertical constructed wetlands was built as a mock-up to test a soil composition developed in collaboration with an ecologist. It also explored how water dripping directly onto the plants as it flows from one treatment basin to the next affects their growth. Since larger soil areas are required to properly assess the wastewater treatment capacity of reeds and rushes in greywater treatment, the prototype primarily serves as a functional demonstration of the concept and its vertical arrangement.'],
        de: ['Der Prototyp für vertikale Pflanzenkläranlagen wurde als Mock-up gebaut, um eine gemeinsam mit einer Ökologin entwickelte Bodenzusammensetzung zu testen. Außerdem wurde untersucht, wie sich Wasser, das beim Fließen von einem Klärbecken zum nächsten direkt auf die Pflanzen tropft, auf deren Wachstum auswirkt. Da für eine belastbare Aussage über die Reinigungsleistung von Schilf und Binsen bei der Grauwasserbehandlung größere Bodenflächen nötig sind, dient der Prototyp vor allem als funktionale Demonstration des Konzepts und seiner vertikalen Anordnung.']
      },
      gal: [{"src": "img/pt-02-tower-axo.webp", "w": 1704, "h": 2362, "cap": "axonometric of the tower", "s": 1, "sc": 1.16}, {"src": "img/pt-01-households.webp", "w": 2200, "h": 1293, "cap": "water consumption diagrams", "s": 1, "sc": 1.0, "ctr": 1, "mid": 1}, {"src": "img/pt-03-roots.webp", "w": 1662, "h": 2200, "cap": "plant roots", "s": 1, "mid": 1}, {"video": "vid/prototype.mp4", "poster": "vid/prototype-poster.jpg", "w": 720, "h": 1280, "cap": "prototype in use", "sc": 1.25}, {"src": "img/pt-04-tower.webp", "w": 1426, "h": 1973, "cap": "prototype in the studio", "s": 1}] },
    { id: 'phytocatalyst', t: 'phytocatalyst', y: 2026, kind: 'photo', ar: '1 / 1', cover: 'img/ph-cover.webp', cw: 2000, ch: 2000,
      sub: { en: 'inhabiting constructed wetlands', de: 'wohnen in pflanzenkläranlagen' },
      who: 'timo marpert', place: 'berlin, germany',
      text: {
        en: ['Phytocatalyst is a study exploring how nature and natural processes can foster communal living. It reimagines the potentially obsolete typology of a parking garage as a new form of collective housing. Shared terraces with planting beds, a vertical constructed wetland and communal circulation spaces form a social infrastructure at the heart of the building, turning community into a lived practice.', 'A section of the existing structure is removed to provide sufficient daylight for the apartments. This opening is complemented by suspended planting beds and water basins, connecting the apartments’ outdoor spaces and transforming them into productive social spaces that strengthen neighbourhood ties. Treated greywater cascades into a central pond before being pumped back to each floor, where residents can access it for watering plants. Rainwater is collected on the roofs and reused for toilet flushing.'],
        de: ['Phytocatalyst ist eine Studie darüber, wie die Natur und natürliche Prozesse das gemeinschaftliche Wohnen fördern können. Sie denkt die potenziell überflüssig werdende Typologie des Parkhauses als neue Form kollektiven Wohnens neu. Gemeinschaftliche Terrassen mit Pflanzbeeten, eine vertikale Pflanzenkläranlage und gemeinsame Erschließungsräume bilden eine soziale Infrastruktur im Herzen des Gebäudes und machen Gemeinschaft zu gelebter Praxis.', 'Ein Teil der bestehenden Struktur wird entfernt, damit die Wohnungen ausreichend Tageslicht erhalten. Diese Öffnung wird durch abgehängte Pflanzbeete und Wasserbecken ergänzt, die die Außenräume der Wohnungen verbinden und sie in produktive soziale Räume verwandeln, welche die Nachbarschaft stärken. Gereinigtes Grauwasser fließt kaskadenartig in einen zentralen Teich, bevor es zurück in jedes Geschoss gepumpt wird, wo die Bewohnerinnen und Bewohner es zum Gießen der Pflanzen nutzen können. Regenwasser wird auf den Dächern gesammelt und für die Toilettenspülung wiederverwendet.']
      },
      gal: [{"quote": "\u201cI realized that I can neither live without nature in the city nor spend my entire life in untouched nature. I need people, I need culture, and everything that comes with it.\u201d", "by": "Ot Hoffmann, interview for Biotope City"}, {"src": "img/ph-01-existing.webp", "w": 1280, "h": 939, "cap": "existing building, \u00a9 j\u00fcrgen henschel", "s": 1}, {"src": "img/ph-02-interior.webp", "w": 1280, "h": 1651, "cap": "existing parking deck", "s": 1, "sc": 1.301}, {"src": "img/ph-06-plants-v2.webp", "w": 963, "h": 963, "cap": "planting", "s": 1, "sc": 0.98}, {"src": "img/ph-03-axo-1.webp", "w": 1938, "h": 2236, "cap": "axonometry", "s": 1, "sc": 0.463, "ctr": 1, "mid": 1}, {"src": "img/ph-04-axo-2.webp", "w": 1327, "h": 2400, "cap": "axonometry", "s": 1, "sc": 0.956, "ctr": 1}, {"src": "img/ph-05-axo-3.webp", "w": 1947, "h": 2286, "cap": "axonometry", "s": 1, "sc": 0.591, "ctr": 1, "mid": 1}, {"src": "img/ph-07-plan-v2.webp", "w": 2400, "h": 1395, "cap": "floor plan", "s": 1, "sc": 1.28, "ctr": 1}, {"src": "img/ph-08-detail.webp", "w": 1459, "h": 2400, "cap": "detail axonometry", "s": 1, "sc": 1.45, "ctr": 1}, {"src": "img/ph-09-section.webp", "w": 2800, "h": 1260, "cap": "section", "s": 1, "sc": 1.35, "ctr": 1}, {"src": "img/ph-cover.webp", "w": 2000, "h": 2000, "cap": "model", "s": 1}, {"src": "img/ph-10-view.webp", "w": 2730, "h": 1536, "cap": "visualisation", "s": 1, "sc": 1.387}] },
    { id: 'bda-galerie-berlin', t: 'bda galerie berlin', y: 2024, kind: 'photo', ar: '1 / 1', cover: 'img/kn-02-wall.webp', cw: 2362, ch: 2362, cn: 7, cm: 7,
      sub: 'knaupen als kulturtechnik, vorbereitende untersuchungen einer neuen ästhetik des bauens', who: 'malik al bosta, ferdinand arends, hendrik kronenberger, jens metz,<br>frederic omlor, ulrich pantle, marco schneider, max sordon', place: 'berlin, germany',
      text: {"en": ["The exhibition Knaupen als Kulturtechnik \u2013 Vorbereitende Untersuchungen zu einer neuen \u00c4sthetik des Bauens (Knaupen as a Cultural Technique \u2013 Preliminary Studies towards a New Aesthetic of Building) was on display at the BDA Gallery in Berlin from September to October 2024.", "Knaupen, also spelled Knauben, is a term used in the Saarland region and neighbouring areas to describe a predominantly manual, amateur practice of working on buildings or around and inside the home. It can be understood as a form of DIY or bricolage (FR). The meaning is not clearly defined and ranges from poorly executed repairs using unsuitable materials that only last for a short time, to the efficient (re)establishment of the functionality of even complex building projects using the simplest means, sometimes resulting in a certain degree of elegance.", "Today, this sustainable and humanistic approach to reusing objects and building components that would otherwise be considered waste or beyond repair is more relevant than ever. The exhibition seeks to introduce this rudimentary practice, deeply rooted in the cultural fabric of the Saarland, and the different, perhaps even desirable, aesthetic of building that emerges from it.", "An exhibition catalogue was subsequently developed in collaboration with Max Sordon and published in an edition of 400 copies. Some of the exhibits were further developed and reworked for a subsequent exhibition at the Kulturzentrum am Eurobahnhof KuBa in Saarbr\u00fccken in June and July 2025. Afterwards, they were further modified, rebuilt, repurposed or dismantled, each finding its way back into a cycle of reuse and transformation."], "de": ["Die Ausstellung Knaupen als Kulturtechnik \u2013 Vorbereitende Untersuchungen zu einer neuen \u00c4sthetik des Bauens war von September bis Oktober 2024 in der BDA Galerie in Berlin zu sehen.", "Knaupen, auch Knauben geschrieben, ist ein Begriff aus dem Saarland und den angrenzenden Regionen f\u00fcr eine \u00fcberwiegend handwerkliche, laienhafte Praxis des Arbeitens an Geb\u00e4uden oder rund um und im Haus. Man kann sie als eine Form von Heimwerken oder Bricolage (FR) verstehen. Die Bedeutung ist nicht klar umrissen und reicht von schlecht ausgef\u00fchrten Reparaturen mit ungeeigneten Materialien, die nur kurz halten, bis zur effizienten (Wieder-)Herstellung der Funktion auch komplexer Bauvorhaben mit einfachsten Mitteln, bisweilen mit einem gewissen Grad an Eleganz.", "Heute ist dieser nachhaltige und humanistische Umgang mit der Wiederverwendung von Gegenst\u00e4nden und Bauteilen, die sonst als Abfall oder nicht mehr reparabel gelten w\u00fcrden, relevanter denn je. Die Ausstellung m\u00f6chte diese rudiment\u00e4re, tief in der Kultur des Saarlandes verwurzelte Praxis vorstellen und die andere, vielleicht sogar w\u00fcnschenswerte \u00c4sthetik des Bauens, die daraus entsteht.", "Anschlie\u00dfend entstand in Zusammenarbeit mit Max Sordon ein Ausstellungskatalog in einer Auflage von 400 Exemplaren. Einige der Exponate wurden f\u00fcr eine folgende Ausstellung im Kulturzentrum am Eurobahnhof KuBa in Saarbr\u00fccken im Juni und Juli 2025 weiterentwickelt und \u00fcberarbeitet. Danach wurden sie weiter ver\u00e4ndert, umgebaut, umgenutzt oder demontiert und fanden so jeweils ihren Weg zur\u00fcck in einen Kreislauf aus Wiederverwendung und Verwandlung."]},
      link: { l: 'bda-berlin.de', u: 'https://bda-berlin.de' },
      pdf: { l: 'deutsches architekt:innen blatt PDF', u: '#dab-blatt' },
      gal: [{"src": "img/kn-13-poster.webp", "w": 1718, "h": 1717, "cap": "poster", "s": 1, "sc": 0.93, "ctr": 1}, {"zt": [0.488, 0.38, 3.6], "src": "img/kn-01-door.webp", "w": 1771, "h": 2362, "cap": "door, knaupen / knauben", "s": 1, "sc": 1.533, "ctr": 1}, {"src": "img/kn-02-wall.webp", "w": 2362, "h": 2362, "cap": "wall installation", "s": 1, "sc": 1.125, "ctr": 1, "off": 0.03}, {"src": "img/kn-03-armchair.webp", "w": 1290, "h": 1717, "cap": "exhibition view", "s": 1, "sc": 1.314, "ctr": 1, "off": -0.03}, {"src": "img/kn-04-kitchen-detail.webp", "w": 1290, "h": 1717, "cap": "detail", "s": 1, "sc": 1.087, "ctr": 1}, {"src": "img/kn-05-brickwall.webp", "w": 1290, "h": 1717, "cap": "exhibition view", "s": 1, "sc": 1.643, "ctr": 1}, {"src": "img/kn-06-kitchen.webp", "w": 1290, "h": 1717, "cap": "kitchen", "s": 1, "sc": 1.026, "ctr": 1, "off": -0.04}, {"src": "img/kn-07-table-top.webp", "w": 1717, "h": 1289, "cap": "table, view from above", "s": 1, "sc": 0.909, "ctr": 1, "off": 0.04}, {"src": "img/kn-08-detail.webp", "w": 1290, "h": 1717, "cap": "detail", "s": 1, "sc": 1.013, "ctr": 1, "off": -0.03}, {"src": "img/kn-09-ernst.webp", "w": 1290, "h": 1717, "cap": "detail", "s": 1, "sc": 0.755, "ctr": 1, "off": 0.05}, {"src": "img/kn-14-catalogue-cover.webp", "w": 1080, "h": 1080, "cap": "catalogue", "s": 1, "ctr": 1, "sc": 1.371}, {"src": "img/kn-15-catalogue-spine.webp", "w": 1080, "h": 1080, "cap": "catalogue, spine", "s": 1, "ctr": 1, "sc": 1.062}, {"src": "img/kn-16-catalogue-back.webp", "w": 1080, "h": 1080, "cap": "catalogue, back", "s": 1, "ctr": 1, "sc": 1.214}, {"src": "img/kn-10-opening.webp", "w": 2400, "h": 1600, "cap": "opening", "s": 1, "sc": 1.065, "ctr": 1}] },
    { id: 'take-five-studio', t: 'take five studio', y: 2023, kind: 'photo', ar: '3 / 4', cover: 'img/tf-11-kitchen-2.webp', cw: 1810, ch: 2400, cm: 7,
      sub: 'transformation of a former archive into a studio space', who: 'ferdinand arends, sigrid arends,<br>hendrik kronenberger, frederic omlor', place: 'saarbr\u00fccken, germany',
      text: {"en": ["The architecture collective Take Five was founded during the pandemic in a vacant ground-floor retail space in Saarbr\u00fccken. Alongside collaborative design studies and competition entries, the collective also organised social gatherings and exhibitions in their shared space. After the pandemic, the original space was rented to new tenants, prompting the collective to look for a new studio. On the seventh floor of the same building, an opportunity arose to convert a 46 sqm archive into a workspace. The design, however, was intended to preserve the possibility of the space being used as a residential apartment in the future.", "In addition to opening up the fa\u00e7ade towards the terrace, the conversion incorporated a bathroom, a fully equipped kitchen and six workstations. The new roof insulation made the additional interior insulation and a suspended ceiling unnecessary, allowing the ceiling and the wall to remain exposed in their original, unrefined materials."], "de": ["Das Architekturkollektiv Take Five wurde w\u00e4hrend der Pandemie in einer leerstehenden Ladenfl\u00e4che im Erdgeschoss in Saarbr\u00fccken gegr\u00fcndet. Neben gemeinsamen Entwurfsstudien und Wettbewerbsbeitr\u00e4gen organisierte das Kollektiv in seinen gemeinsamen R\u00e4umen auch soziale Zusammenk\u00fcnfte und Ausstellungen. Nach der Pandemie wurde die urspr\u00fcngliche Fl\u00e4che an neue Mieter vergeben, sodass das Kollektiv ein neues Studio suchte. Im siebten Stock desselben Geb\u00e4udes ergab sich die Gelegenheit, ein 46 m\u00b2 gro\u00dfes Archiv in einen Arbeitsraum umzubauen. Der Entwurf sollte jedoch die M\u00f6glichkeit erhalten, den Raum in Zukunft als Wohnung zu nutzen.", "Neben der \u00d6ffnung der Fassade zur Terrasse umfasste der Umbau ein Bad, eine voll ausgestattete K\u00fcche und sechs Arbeitspl\u00e4tze. Die neue Dachd\u00e4mmung machte eine zus\u00e4tzliche Innend\u00e4mmung und eine abgeh\u00e4ngte Decke \u00fcberfl\u00fcssig, sodass Decke und Wand in ihren urspr\u00fcnglichen, unver\u00e4nderten Materialien sichtbar bleiben konnten."]},

    { id: 'renaissance-theater', t: 'renaissance theater berlin', y: 2026, kind: 'render', ar: '5 / 4', cover: 'img/rt-cover.webp', cw: 1886, ch: 2200, cn: 6, cm: 7,
      who: 'julia barthel, leo ruchholtz, marco schneider', place: 'berlin, germany',
      text: {"en": ["The Renaissance Theater Berlin, an important part of Berlin\u2019s cultural history since 1922, is the only fully preserved Art Deco theatre in Europe.", "During a workshop involving the theatre, TU Berlin and the architecture collective Noibau, a proposal was developed to temporarily address the ensemble\u2019s current lack of storage space. The intervention combines storage facilities, urban greenery and a social meeting place, serving not only the theatre but also the surrounding neighbourhood.", "A scaffolding structure brings together low-cost storage containers, rainwater harvesting for the irrigation of climbing plants, hydroponic modules that can be operated and maintained by local residents, and advertising surfaces facing the street. Together, these elements form a colourful, multifunctional structure that remains entirely reversible."], "de": ["Das Renaissance-Theater Berlin, seit 1922 ein wichtiger Teil der Berliner Kulturgeschichte, ist das einzige vollst\u00e4ndig erhaltene Art-D\u00e9co-Theater Europas.", "In einem Workshop mit dem Theater, der TU Berlin und dem Architekturkollektiv Noibau wurde ein Vorschlag entwickelt, um den aktuellen Lagerplatzmangel des Ensembles vor\u00fcbergehend zu beheben. Die Intervention verbindet Lagerfl\u00e4chen, urbanes Gr\u00fcn und einen sozialen Treffpunkt und dient nicht nur dem Theater, sondern auch der umliegenden Nachbarschaft.", "Eine Ger\u00fcststruktur vereint kost\u00fcnstige Lagercontainer, Regenwassernutzung zur Bew\u00e4sserung von Kletterpflanzen, hydroponische Module, die von den Anwohnerinnen und Anwohnern betrieben und gepflegt werden k\u00f6nnen, sowie Werbefl\u00e4chen zur Stra\u00dfe hin. Zusammen bilden diese Elemente eine farbenfrohe, multifunktionale Struktur, die vollst\u00e4ndig reversibel bleibt."]},
      gal: [{"src": "img/rt-02-street.webp", "w": 2048, "h": 1536, "cap": "existing situation", "s": 1, "sc": 0.93, "ctr": 1}, {"src": "img/rt-07-plan.webp", "w": 1627, "h": 1600, "cap": "site plan over the historic floor plan", "s": 1, "sc": 1.452, "ctr": 1}, {"src": "img/rt-01-axo.webp", "w": 2400, "h": 1329, "cap": "axonometry", "s": 1, "sc": 1.225, "ctr": 1}, {"src": "img/rt-04-model-long.webp", "w": 2048, "h": 1536, "cap": "model", "s": 1, "sc": 1.2, "ctr": 1, "off": 0.05}, {"src": "img/rt-06-model-elev.webp", "w": 2048, "h": 1305, "cap": "model elevation", "s": 1, "sc": 0.717, "ctr": 1, "off": -0.04}, {"src": "img/rt-03-model.webp", "w": 2048, "h": 1536, "cap": "model", "s": 1, "sc": 1.286, "ctr": 1, "off": 0.07}, {"src": "img/rt-05-model-top.webp", "w": 1536, "h": 2048, "cap": "model detail", "s": 1, "sc": 1.077, "ctr": 1, "off": 0.03}] },
    { id: 'pedestrian-bridge', t: 'pedestrian bridge', y: 2025, kind: 'render', ar: '5 / 4', cover: 'img/pb-03-entrance.webp', cw: 2400, ch: 2400, cn: 7, cm: 7, cmt: 1,
      who: 'julius morgenstern', place: 'berlin, germany',
      text: {"en": ["The design for a pedestrian bridge connecting the newly developed Europacity with the residential neighbourhood to the west across the railway tracks was developed as part of a student ideas competition. The proposal builds upon the new open-space design on the western side, extending it through a carefully shaped topography that creates elevated viewpoints and new visual connections. On the eastern side, the bridge abutment is integrated into a landscaped green mound and complemented by a forecourt with seating areas.", "The bridge structure consists of cantilevered arms, each fixed at one end and arranged in a mirrored, symmetrical system. Working together, they provide the structural capacity required to span the railway tracks without the need for intermediate supports within the railway corridor."], "de": ["Der Entwurf f\u00fcr eine Fu\u00dfg\u00e4ngerbr\u00fccke, die das neu entwickelte Europacity \u00fcber die Bahngleise hinweg mit dem Wohnquartier im Westen verbindet, entstand im Rahmen eines studentischen Ideenwettbewerbs. Der Vorschlag baut auf der neuen Freiraumgestaltung auf der Westseite auf und f\u00fchrt sie durch eine sorgf\u00e4ltig modellierte Topografie weiter, die erh\u00f6hte Aussichtspunkte und neue Sichtbeziehungen schafft. Auf der Ostseite ist das Br\u00fcckenwiderlager in einen landschaftlich gestalteten gr\u00fcnen H\u00fcgel integriert und durch einen Vorplatz mit Sitzbereichen erg\u00e4nzt.", "Das Br\u00fcckentragwerk besteht aus auskragenden Armen, die jeweils an einem Ende eingespannt und in einem gespiegelten, symmetrischen System angeordnet sind. Gemeinsam erbringen sie die Tragf\u00e4higkeit, die n\u00f6tig ist, um die Bahngleise ohne Zwischenst\u00fctzen im Gleiskorridor zu \u00fcberspannen."]},
      gal: [{"src": "img/pb-01-aerial.webp", "w": 2400, "h": 1666, "cap": "aerial view", "s": 1, "sc": 0.814, "ctr": 1}, {"src": "img/pb-02-plan.webp", "w": 1762, "h": 1717, "cap": "site plan", "s": 1, "sc": 1.53, "ctr": 1}, {"src": "img/pb-03-entrance.webp", "w": 2400, "h": 2400, "cap": "entrance", "s": 1, "sc": 1.125, "ctr": 1}, {"src": "img/pb-04-section.webp", "w": 2239, "h": 694, "cap": "section", "s": 1, "sc": 0.8, "ctr": 1}, {"src": "img/pb-05-walkway.webp", "w": 2400, "h": 2400, "cap": "bridge deck", "s": 1, "sc": 0.87, "ctr": 1, "off": 0.04}, {"src": "img/pb-06-structure.webp", "w": 963, "h": 1717, "cap": "structural system", "s": 1, "sc": 1.696, "ctr": 1}, {"src": "img/pb-07-detail.webp", "w": 2400, "h": 2400, "cap": "detail", "s": 1, "sc": 1.256, "ctr": 1}] },

    if (t.closest && t.closest('[data-close]')) { popSet(null); if (indexOpen) ixSet(false); }
  });

  });

  render();
})();
